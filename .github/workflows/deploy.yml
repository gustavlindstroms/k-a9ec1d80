name: Uppdatera OMX och publicera

on:
  push:
    branches: [main]
  schedule:
    # Var 15:e minut under börsens öppettider (UTC, täcker både sommar- och vintertid)
    - cron: "*/15 7-16 * * 1-5"
    - cron: "5 17 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - name: Hämta OMXS30
        run: python3 scripts/fetch_omx.py
      - name: Spara värdet i repot (håller schemat aktivt)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 6edea6c9/omx.json
          git diff --cached --quiet || (git commit -m "OMX-uppdatering" && git push)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - uses: actions/deploy-pages@v4
