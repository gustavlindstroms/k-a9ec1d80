<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Kontorsskärm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1f2625;           /* fördjupad Grön #42504E */
    --bg-2: #42504E;
    --text: #ffffff;
    --muted: rgba(255,255,255,.62);
    --orange: #FF6B0B; --pink: #FFB7F8; --cyan: #79F2FB;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(120% 90% at 15% 10%, var(--bg-2) 0%, var(--bg) 60%);
    color: var(--text);
    font-family: Manrope, Arial, sans-serif;
    overflow: hidden;
    cursor: none;
  }
  .logo { position: fixed; top: 5vh; left: 5vw; height: 6vh; min-height: 30px; }
  main {
    height: 100%; display: flex; flex-direction: column;
    justify-content: center; padding-left: 5vw;
  }
  .time {
    font-weight: 800; letter-spacing: -0.04em; line-height: .9;
    font-size: 21vw; font-size: min(23vw, 34vh);
    font-variant-numeric: tabular-nums;
  }
  .time .sec { font-weight: 300; font-size: .28em; letter-spacing: 0; color: var(--muted); margin-left: .25em; vertical-align: .15em; }
  .date { margin-top: 3vh; font-weight: 400; font-size: 4vw; font-size: min(4.2vw, 6vh); color: var(--muted); }
    .bar {
    position: fixed; left: 0; right: 0; bottom: 0; height: .9vh; min-height: 5px;
    background: linear-gradient(90deg, var(--orange), var(--pink) 50%, var(--cyan));
  }
  .weather {
    position: fixed; right: 5vw; bottom: 5vh; text-align: right;
    font-size: 1.6vw; font-size: min(1.8vw, 2.6vh); color: var(--muted); line-height: 1.35;
  }
  .el {
    position: fixed; left: 5vw; bottom: 5vh;
    font-size: 1.6vw; font-size: min(1.8vw, 2.6vh); color: var(--muted); line-height: 1.35;
  }
  .el strong { display: block; color: var(--text); font-weight: 600; font-size: 1.9em; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .weather strong { display: block; color: var(--text); font-weight: 600; font-size: 1.9em; letter-spacing: -0.02em; }
</style>
</head>
<body>
  <img class="logo" src="logo-white.svg" alt="forefront">
  <main>
    <div class="time" id="time">--:--</div>
    <div class="date" id="date">&nbsp;</div>
  </main>
  <div class="el" id="el" hidden>
    <strong id="elnow">–</strong>
    <span id="eldesc">Elpris SE4</span>
  </div>
  <div class="weather" id="weather" hidden>
    <strong id="temp">–</strong>
    <span id="wdesc">Malmö</span>
  </div>
  <div class="bar"></div>
<script>
/* Skrivet i ES5 med XMLHttpRequest så att det fungerar i äldre TV-webbläsare. */
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var pad = function (n) { return (n < 10 ? '0' : '') + n; };

  /* ---------- Servertid ----------
     offset = servertid − TV:ns klocka. Mäts mot tidsserver, bästa av flera prov
     (lägst svarstid), och mäts om var 10:e minut. */
  var offset = 0, synced = false;
  function now() { return Date.now() + offset; }

  function get(url, cb) {
    var x = new XMLHttpRequest();
    x.open('GET', url, true);
    x.timeout = 8000;
    x.onload = function () { cb(x.status >= 200 && x.status < 300 ? x.responseText : null); };
    x.onerror = x.ontimeout = function () { cb(null); };
    x.send();
  }
  var SOURCES = [
    { url: 'https://time.akamai.com/?iso&ms', parse: function (t) { return Date.parse(t); } },
    { url: 'https://timeapi.io/api/time/current/zone?timeZone=UTC', parse: function (t) { return Date.parse(JSON.parse(t).dateTime.slice(0, 23) + 'Z'); } }
  ];
  function sample(src, cb) {
    var t0 = Date.now();
    get(src.url + (src.url.indexOf('?') < 0 ? '?' : '&') + '_=' + t0, function (txt) {
      var t1 = Date.now(), server = NaN;
      try { server = txt ? src.parse(txt) : NaN; } catch (e) {}
      cb(isNaN(server) ? null : { offset: server - (t0 + t1) / 2, rtt: t1 - t0 });
    });
  }
  function sync(srcIdx) {
    srcIdx = srcIdx || 0;
    var src = SOURCES[srcIdx], best = null, n = 0;
    (function next() {
      sample(src, function (r) {
        if (r && (!best || r.rtt < best.rtt)) best = r;
        if (++n < 4) return next();
        if (best) { offset = best.offset; synced = true; }
        else if (srcIdx + 1 < SOURCES.length) sync(srcIdx + 1);
      });
    })();
  }
  sync();
  setInterval(sync, 10 * 60 * 1000);

  /* ---------- Stockholmstid utan att lita på TV:ns tidszon ----------
     CET (UTC+1), sommartid CEST (UTC+2) från sista söndagen i mars 01:00 UTC
     till sista söndagen i oktober 01:00 UTC. */
  function lastSundayUTC(y, m) {
    var d = new Date(Date.UTC(y, m + 1, 0, 1));
    d.setUTCDate(d.getUTCDate() - d.getUTCDay());
    return d.getTime();
  }
  function sthlm(ms) {
    var y = new Date(ms).getUTCFullYear();
    var dst = ms >= lastSundayUTC(y, 2) && ms < lastSundayUTC(y, 9);
    var d = new Date(ms + (dst ? 2 : 1) * 3600000);
    return { y: d.getUTCFullYear(), mo: d.getUTCMonth(), d: d.getUTCDate(), wd: d.getUTCDay(),
             h: d.getUTCHours(), mi: d.getUTCMinutes(), s: d.getUTCSeconds() };
  }
  var DAYS = ['Söndag', 'Måndag', 'Tisdag', 'Onsdag', 'Torsdag', 'Fredag', 'Lördag'];
  var MONTHS = ['januari', 'februari', 'mars', 'april', 'maj', 'juni', 'juli', 'augusti', 'september', 'oktober', 'november', 'december'];
  function ymd(t) { return t.y + '-' + pad(t.mo + 1) + '-' + pad(t.d); }

  var lastReloadDay = null;
  function tick() {
    var ms = now(), t = sthlm(ms);
    $('time').innerHTML = pad(t.h) + ':' + pad(t.mi) + '<span class="sec">' + pad(t.s) + '</span>';
    $('date').textContent = DAYS[t.wd] + ' ' + t.d + ' ' + MONTHS[t.mo] + ' ' + t.y;
    /* Ladda om kl 04 varje natt så nya versioner slår igenom */
    if (t.h === 4 && t.mi === 0 && synced && lastReloadDay !== null && lastReloadDay !== ymd(t)) location.reload();
    if (lastReloadDay === null) lastReloadDay = ymd(t);
    setTimeout(tick, 1000 - (ms % 1000) + 5);
  }
  tick();

  /* ---------- Väder i Malmö (Open-Meteo) ---------- */
  var WMO = {0:'Klart',1:'Mest klart',2:'Halvklart',3:'Mulet',45:'Dimma',48:'Dimma',51:'Duggregn',53:'Duggregn',55:'Duggregn',
    61:'Regn',63:'Regn',65:'Kraftigt regn',66:'Underkylt regn',67:'Underkylt regn',71:'Snö',73:'Snö',75:'Kraftig snö',77:'Snö',
    80:'Regnskurar',81:'Regnskurar',82:'Kraftiga skurar',85:'Snöbyar',86:'Snöbyar',95:'Åska',96:'Åska',99:'Åska'};
  function r(n) { return String(Math.round(n)).replace('-', '−'); }
  function weather() {
    get('https://api.open-meteo.com/v1/forecast?latitude=55.605&longitude=13.0038'
      + '&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min&timezone=Europe%2FStockholm&forecast_days=1',
      function (txt) {
        if (!txt) return;
        try {
          var d = JSON.parse(txt);
          $('temp').textContent = r(d.current.temperature_2m) + '°';
          $('wdesc').textContent = 'Malmö · ' + (WMO[d.current.weather_code] || '') + ' · '
            + r(d.daily.temperature_2m_min[0]) + '°/' + r(d.daily.temperature_2m_max[0]) + '°';
          $('weather').hidden = false;
        } catch (e) {}
      });
  }
  weather();
  setInterval(weather, 15 * 60 * 1000);

  /* ---------- Elpris SE4, spotpris exkl. moms och avgifter (elprisetjustnu.se) ---------- */
  var elDay = null, elPrices = [];
  function ore(kr) { return Math.round(kr * 100); }
  function elRender() {
    if (!elPrices.length) return;
    var ms = now(), cur = null, sum = 0;
    for (var i = 0; i < elPrices.length; i++) {
      var p = elPrices[i];
      sum += p.SEK_per_kWh;
      if (Date.parse(p.time_start) <= ms && ms < Date.parse(p.time_end)) cur = p;
    }
    $('elnow').textContent = cur ? ore(cur.SEK_per_kWh) + ' öre/kWh' : '–';
    $('eldesc').textContent = 'Elpris SE4 · snitt idag ' + ore(sum / elPrices.length) + ' öre';
    $('el').hidden = false;
  }
  function el() {
    var day = ymd(sthlm(now()));
    if (day === elDay && elPrices.length) return elRender();
    var parts = day.split('-');
    get('https://www.elprisetjustnu.se/api/v1/prices/' + parts[0] + '/' + parts[1] + '-' + parts[2] + '_SE4.json', function (txt) {
      if (txt) { try { elPrices = JSON.parse(txt); elDay = day; } catch (e) {} }
      elRender();
    });
  }
  setTimeout(el, 1500); /* vänta in första tidssynken */
  setInterval(el, 60 * 1000);
})();
</script>
</body>
</html>
